<style>
/* HomeDash styles – everything is driven by CSS variables so themes & custom CSS are easy. */
:root {
  --accent: #6366f1; --radius: 14px; --cols: 4;
  --bg: #0f1117; --bg2: #151823; --card: rgba(255,255,255,.05); --card-b: rgba(255,255,255,.09);
  --text: #e8eaf0; --muted: #8b92a5; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --input: rgba(255,255,255,.06);
  --shadow: 0 8px 30px rgba(0,0,0,.25); --blur: 14px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] { --bg:#f3f4f8; --bg2:#fff; --card:rgba(255,255,255,.8); --card-b:rgba(0,0,0,.08); --text:#1b1f2a; --muted:#667085; --input:rgba(0,0,0,.045); --shadow:0 6px 24px rgba(20,30,60,.08); }
:root[data-theme="midnight"] { --bg:#05060a; --bg2:#0a0c14; --card:rgba(255,255,255,.035); --card-b:rgba(255,255,255,.07); }
:root[data-theme="nord"] { --bg:#2e3440; --bg2:#3b4252; --card:rgba(216,222,233,.07); --card-b:rgba(216,222,233,.13); --text:#eceff4; --muted:#9aa5b8; }
:root[data-theme="dracula"] { --bg:#1e1f29; --bg2:#282a36; --card:rgba(189,147,249,.07); --card-b:rgba(189,147,249,.16); --text:#f8f8f2; --muted:#9aa0c0; }
:root[data-theme="forest"] { --bg:#0e1511; --bg2:#142019; --card:rgba(180,255,200,.05); --card-b:rgba(180,255,200,.11); --text:#e6f2ea; --muted:#8fa797; }

* { box-sizing: border-box; }
html { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
body { margin: 0; font: 15px/1.45 var(--font); color: var(--text); background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
#bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent), radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent), var(--bg); background-size: cover; background-position: center; }
#bg.img::after { content:""; position:absolute; inset:0; background: color-mix(in srgb, var(--bg) 55%, transparent); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1,h2,h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ---------- cards */
.card { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
body.cs-glass .card, body.cs-glass .modal, body.cs-glass header.top { backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
body.cs-solid .card { background: var(--bg2); }
body.cs-flat .card { box-shadow: none; background: transparent; }

/* ---------- buttons & inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: calc(var(--radius) * .7); border: 1px solid var(--card-b); background: var(--input); cursor: pointer; transition: .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 13px; } .btn.icon { padding: 5px 8px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
input[type=text], input[type=password], input[type=url], input[type=number], select, textarea { width: 100%; padding: 8px 11px; border-radius: calc(var(--radius) * .7); border: 1px solid var(--card-b); background: var(--input); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
select option { background: var(--bg2); color: var(--text); }
textarea { font-family: var(--mono); font-size: 13px; resize: vertical; min-height: 90px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=color] { width: 54px; height: 34px; border: 1px solid var(--card-b); background: var(--input); border-radius: 8px; padding: 2px; }
label.f { display: block; margin: 0 0 14px; } label.f > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px; } label.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.sb { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 16px; }

/* ---------- header */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 22px; border-bottom: 1px solid var(--card-b); background: color-mix(in srgb, var(--bg) 70%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 16px; }
nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
nav.tabs a { padding: 6px 12px; border-radius: 10px; color: var(--muted); } nav.tabs a:hover { color: var(--text); background: var(--input); }
nav.tabs a.on { color: var(--text); background: color-mix(in srgb, var(--accent) 20%, transparent); }
header .search { max-width: 260px; } header select { width: auto; padding: 5px 8px; }
.spacer { flex: 1; }

main { max-width: 1500px; margin: 0 auto; padding: 22px; display: flex; flex-direction: column; gap: 26px; }
.sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.sec-h .line { flex: 1; height: 1px; background: var(--card-b); min-width: 20px; }

/* ---------- clock */
.clocks { display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch; }
.clock-main { padding: 18px 26px; } .clock-main .time { font-size: 54px; font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-main .time small { font-size: 22px; color: var(--muted); margin-left: 4px; } .clock-main .date { color: var(--muted); margin-top: 6px; }
.clock-z { padding: 14px 18px; } .clock-z .time { font-size: 26px; font-variant-numeric: tabular-nums; } .clock-z .z { font-size: 12px; color: var(--muted); }
.clock-srv { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; justify-content: center; }

/* ---------- system */
.sys { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 14px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; word-break: break-word; }
.bar { height: 8px; border-radius: 99px; background: var(--input); overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.metric { margin-bottom: 12px; } .metric:last-child { margin-bottom: 0; } .metric .top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; gap: 10px; }
.metric .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpu-wrap { display: flex; gap: 16px; align-items: center; } .ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { transform: rotate(-90deg); } .ring .v { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 650; }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; } .ring .bg { stroke: var(--input); } .ring .fg { stroke: var(--accent); transition: stroke-dashoffset .6s; }
.ring.warn .fg { stroke: var(--warn); } .ring.bad .fg { stroke: var(--bad); }
.spark { width: 100%; height: 38px; display: block; } .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; } .spark path { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
.cores { display: flex; gap: 3px; align-items: flex-end; height: 28px; margin-top: 10px; } .cores i { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px; min-height: 2px; transition: height .6s; }
.net { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .net b { font-size: 19px; font-weight: 600; } .net .l { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; } .chip { padding: 5px 10px; border-radius: 99px; background: var(--input); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; border: 1px solid transparent; }
.chip b { font-variant-numeric: tabular-nums; } .chip.warn { border-color: var(--warn); } .chip.bad { border-color: var(--bad); color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; } .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* ---------- link tiles */
.cat { margin-bottom: 18px; } .cat-h { display: flex; align-items: center; gap: 8px; margin: 0 0 9px 2px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(min(var(--cols), 3), minmax(0, 1fr)); } }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } header.top { flex-wrap: wrap; padding: 10px 14px; gap: 8px; } header .search { order: 10; max-width: none; flex: 1 1 100%; } nav.tabs { order: 5; margin-left: 0; flex: 1 1 100%; } .uname, .brand .small { display: none; } header .btn { padding: 6px 10px; } main { padding: 14px; } .clock-main .time { font-size: 42px; } }
.tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; transition: .15s; position: relative; cursor: pointer; }
.tile:hover { transform: translateY(-2px); border-color: var(--accent); }
.tile .t { min-width: 0; } .tile .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tile .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 38px; height: 38px; flex: none; border-radius: calc(var(--radius) * .6); display: grid; place-items: center; background: var(--input); overflow: hidden; font-size: 20px; font-weight: 700; color: var(--accent); }
.ico img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
.tile.add { justify-content: center; color: var(--muted); border-style: dashed; }
.editing .tile[draggable=true] { cursor: grab; } .tile .pen { position: absolute; top: 6px; right: 8px; font-size: 12px; opacity: .7; }
.tile.drop { outline: 2px dashed var(--accent); }

/* ---------- docker */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--card-b); border-radius: 10px; overflow: hidden; } .seg button { background: transparent; border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); } .seg button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); }
.dock { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.dc { display: flex; flex-direction: column; gap: 10px; padding: 14px; } .dc .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.dc .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .dc .im { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc .st { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; } .dc .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.port { padding: 2px 8px; border-radius: 99px; background: var(--input); font-size: 12px; font-family: var(--mono); } a.port:hover { background: var(--accent); color: #fff; }
.proj { padding: 14px; display: flex; flex-direction: column; gap: 10px; } .proj .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .proj .nm { font-weight: 600; }
.svc { display: flex; flex-wrap: wrap; gap: 6px; } .svc span { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--input); display: inline-flex; align-items: center; gap: 6px; }
.empty { padding: 22px; text-align: center; color: var(--muted); }

/* ---------- home assistant */
.ha { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.hat { padding: 14px; cursor: default; display: flex; flex-direction: column; gap: 4px; transition: .15s; } .hat.act { cursor: pointer; } .hat.act:hover { border-color: var(--accent); }
.hat.on { background: color-mix(in srgb, var(--accent) 20%, var(--card)); border-color: var(--accent); }
.hat .e { font-size: 22px; } .hat .s { font-size: 20px; font-weight: 600; } .hat .n { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- modal / toast */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--radius); padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal.wide { width: min(900px, 100%); } .modal h2 { margin-bottom: 14px; font-size: 18px; } .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
pre.logs { background: #0a0c10; color: #cfd6e4; padding: 12px; border-radius: 10px; font: 12px/1.5 var(--mono); max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
#toasts { position: fixed; bottom: 18px; right: 18px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--bg2); border: 1px solid var(--card-b); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 380px; animation: in .2s; } .toast.err { border-left-color: var(--bad); } .toast.ok { border-left-color: var(--ok); }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; } .auth .card { width: min(400px, 100%); padding: 28px; }
.auth h1 { font-size: 24px; margin: 14px 0 4px; } .auth .err { color: var(--bad); font-size: 13.5px; min-height: 20px; margin-bottom: 8px; }

/* ---------- admin */
.admin { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; } @media (max-width: 800px) { .admin { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 80px; } .side a { padding: 9px 12px; border-radius: 10px; color: var(--muted); } .side a:hover { background: var(--input); color: var(--text); } .side a.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--text); }
.panel { padding: 22px; } .panel > h2 { margin-bottom: 18px; }
table.t { width: 100%; border-collapse: collapse; } table.t th, table.t td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--card-b); font-size: 14px; } table.t th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.wl { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; } .wl .it { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--card-b); border-radius: 10px; background: var(--input); }
pre.code { background: #0a0c10; color: #cfd6e4; padding: 12px; border-radius: 10px; font: 12.5px/1.5 var(--mono); overflow: auto; margin: 8px 0 0; }
.themes { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- terminal */
.termwrap { background: #0b0d12; border: 1px solid var(--card-b); border-radius: var(--radius); height: calc(100vh - 190px); min-height: 320px; padding: 8px; overflow: hidden; position: relative; }
.termwrap .xterm { height: 100%; } .termwrap .xterm-viewport { background: transparent !important; }
.bterm { height: 100%; overflow: auto; font: 14px/1.25 var(--mono); color: #d6dbe6; white-space: pre; outline: none; cursor: text; }
.bterm .cur { background: #d6dbe6; color: #0b0d12; }

</style>

<script>
'use strict';
/* HomeDash frontend core: state, api, theming, login, dashboard widgets. Admin panel -> admin.js, terminal -> terminal.js */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let LANG = 'en';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
const errMsg = e => { const k = 'e_' + (e && e.message); return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || (e && e.message) || t('error'); };

const S = { pub: null, me: null, cfg: null, sys: null, dock: null, comp: null, ha: null, hist: { cpu: [], rx: [], tx: [] }, srvOff: 0,
  edit: false, filter: 'all', q: '', timers: [], route: 'home', _j: {} };

async function api(path, o = {}) {
  const init = { method: o.method || 'GET', headers: { 'X-Requested-With': 'homedash' }, credentials: 'same-origin' };
  if (o.body !== undefined) { init.body = JSON.stringify(o.body); init.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(path, init);
  let data = null; try { data = await r.json(); } catch { /* not json */ }
  if (!r.ok) {
    if (r.status === 401 && S.me && !path.startsWith('/api/login')) { S.me = null; stopTimers(); renderLogin(); }
    const e = new Error((data && data.error) || r.statusText); e.status = r.status; throw e;
  }
  return data;
}
function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 6000 : 3000);
}

/* ---------- formatting */
const fmtB = n => { if (!isFinite(n)) return '–'; const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB']; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return n.toFixed(i < 2 ? 0 : 1) + ' ' + u[i]; };
const fmtUp = s => { s = Math.floor(s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + (h || d ? h + 'h ' : '') + m + 'm'; };
const lvl = p => p >= 90 ? 'bad' : p >= 75 ? 'warn' : '';
const secHead = (title, extra = '') => `<div class="sec-h"><h2>${esc(title)}</h2><div class="line"></div>${extra}</div>`;
const bar = (p) => `<div class="bar ${lvl(p)}"><i style="width:${Math.max(0, Math.min(100, p)).toFixed(1)}%"></i></div>`;
const rand = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); };

/* ---------- theming */
function applyLook(src) {
  const root = document.documentElement;
  let theme = (S.me && S.me.theme) || src.theme || 'auto';
  if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  root.dataset.theme = theme;
  root.style.setProperty('--accent', src.accent || '#6366f1');
  root.style.setProperty('--radius', (src.radius ?? 14) + 'px');
  root.style.setProperty('--cols', src.columns || 4);
  document.body.classList.remove('cs-glass', 'cs-solid', 'cs-flat'); document.body.classList.add('cs-' + (src.card_style || 'glass'));
  const bg = $('#bg');
  if (src.background && /^(https?:\/\/|\/)[^"'()\s]+$/.test(src.background)) { bg.style.backgroundImage = `url("${src.background}")`; bg.classList.add('img'); }
  else { bg.style.backgroundImage = ''; bg.classList.remove('img'); }
  let st = $('#custom-css'); if (!st) { st = document.createElement('style'); st.id = 'custom-css'; document.head.appendChild(st); }
  st.textContent = src.custom_css || '';
  document.title = src.title || 'HomeDash';
}
function pickLang(def) {
  const saved = localStorage.getItem('hd_lang'); if (saved && I18N[saved]) return saved;
  if (def && I18N[def] && def !== 'en') return def;
  const nav = (navigator.language || 'en').slice(0, 2); return I18N[nav] ? nav : (def && I18N[def] ? def : 'en');
}
const langOptions = cur => Object.keys(LANG_NAMES).map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${LANG_NAMES[k]}</option>`).join('');

/* ---------- boot / auth */
async function boot() {
  S.pub = await api('/api/public');
  LANG = pickLang(S.pub.language); applyLook(S.pub);
  if (S.pub.needs_setup) return renderAuth(true);
  try { S.me = await api('/api/me'); } catch { S.me = null; }
  if (!S.me) return renderAuth(false);
  await loadCfg();
  LANG = S.me.language || localStorage.getItem('hd_lang') || S.cfg.language;
  applyLook(S.cfg); route();
}
async function loadCfg() { S.cfg = await api('/api/config'); }

function renderAuth(setup) {
  stopTimers();
  $('#app').innerHTML = `<div class="auth"><form class="card" id="af"><div class="logo">⌂</div>
    <h1>${esc(setup ? t('setup_title') : S.pub.title)}</h1><div class="muted small" style="margin-bottom:18px">${esc(setup ? t('setup_desc') : '')}</div>
    <label class="f"><span>${t('username')}</span><input type="text" name="username" autocomplete="username" autofocus required></label>
    <label class="f"><span>${t('password')}${setup ? ' · ' + esc(t('password_hint')) : ''}</span><input type="password" name="password" autocomplete="${setup ? 'new-password' : 'current-password'}" minlength="${setup ? 8 : 1}" required></label>
    <div class="err" id="ae"></div>
    <button class="btn primary" style="width:100%;justify-content:center">${esc(setup ? t('create_admin') : t('sign_in'))}</button>
    <div class="row" style="margin-top:16px;justify-content:center"><select id="l0" style="width:auto">${langOptions(LANG)}</select></div></form></div>`;
  $('#l0').onchange = e => { localStorage.setItem('hd_lang', e.target.value); LANG = e.target.value; renderAuth(setup); };
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try {
      if (setup) await api('/api/setup', { method: 'POST', body: { ...f, language: LANG } });
      await api('/api/login', { method: 'POST', body: f });
      await boot();
    } catch (err) { $('#ae').textContent = errMsg(err); }
  };
}

/* ---------- shell / routing */
function stopTimers() { S.timers.forEach(clearInterval); S.timers = []; }
function route() {
  const [r, sub] = location.hash.replace(/^#\/?/, '').split('/');
  const admin = S.me.role === 'admin';
  S.route = r === 'admin' && admin ? 'admin' : r === 'terminal' && admin ? 'terminal' : 'home';
  stopTimers(); if (typeof closeTerm === 'function') closeTerm();
  renderShell();
  if (S.route === 'terminal') viewTerminal();
  else if (S.route === 'admin') viewAdmin(sub || 'general');
  else viewHome();
}
window.addEventListener('hashchange', () => S.me && route());

function renderShell() {
  const admin = S.me.role === 'admin', home = S.route === 'home';
  const tab = (h, label, on) => `<a href="${h}" class="${on ? 'on' : ''}">${esc(label)}</a>`;
  $('#app').innerHTML = `<header class="top">
    <a class="brand" href="#/"><div class="logo">⌂</div><div>${esc(S.cfg.title)}${S.cfg.subtitle ? `<div class="small muted" style="font-weight:400;line-height:1.1">${esc(S.cfg.subtitle)}</div>` : ''}</div></a>
    <nav class="tabs">${tab('#/', t('dashboard'), home)}${admin && S.cfg.terminal.enabled ? tab('#/terminal', t('terminal'), S.route === 'terminal') : ''}${admin ? tab('#/admin', t('admin'), S.route === 'admin') : ''}</nav>
    <div class="spacer"></div>
    ${home ? `<input class="search" id="q" type="text" placeholder="${esc(t('search'))}" value="${esc(S.q)}">` : ''}
    ${home && admin ? `<button class="btn ${S.edit ? 'primary' : ''}" data-act="edit-toggle">${S.edit ? '✓ ' + esc(t('done')) : '✎ ' + esc(t('edit'))}</button>` : ''}
    <select id="langsel" title="${esc(t('language'))}">${langOptions(LANG)}</select>
    <button class="btn" data-act="profile">👤<span class="uname"> ${esc(S.me.username)}</span></button>
    <button class="btn" data-act="logout" title="${esc(t('logout'))}">⎋</button></header><main id="view"></main>`;
  $('#langsel').onchange = async e => { localStorage.setItem('hd_lang', e.target.value); await api('/api/me', { method: 'PUT', body: { language: e.target.value } }); S.me.language = e.target.value; LANG = e.target.value; route(); };
  const q = $('#q'); if (q) q.oninput = () => { S.q = q.value.trim().toLowerCase(); applySearch(); };
}

/* ---------- icons */
function icon(ic, url, name) {
  ic = (ic || '').trim();
  const letter = esc((name || '?').trim().charAt(0).toUpperCase());
  const img = src => `<img class="ic" loading="lazy" src="${esc(src)}" alt="" data-l="${letter}">`;
  let inner = '';
  if (/^https?:\/\//i.test(ic)) inner = img('/api/icon?src=' + encodeURIComponent(ic));
  else if (ic.startsWith('/')) inner = img(ic);
  else if (/^di:/i.test(ic)) inner = img('/api/icon?di=' + encodeURIComponent(ic.slice(3).trim().toLowerCase()));
  else if (ic && !/^[\w.:-]+$/.test(ic)) inner = esc(ic);
  else if (/^https?:\/\//i.test(url || '')) inner = img('/api/icon?fav=' + encodeURIComponent(url));
  return `<div class="ico">${inner || letter}</div>`;
}
document.addEventListener('error', e => {
  const el = e.target; if (el && el.tagName === 'IMG' && el.classList.contains('ic') && el.parentNode) el.parentNode.textContent = el.dataset.l || '?';
}, true);

/* ---------- home view */
function viewHome() {
  const view = $('#view'); view.classList.toggle('editing', S.edit);
  view.innerHTML = S.cfg.widgets.filter(w => w.on).map(w => `<section id="w-${w.id}"></section>`).join('');
  renderClock(); renderSystem(); renderLinks(); renderDocker(); renderCompose(); renderHA(); startPolling();
}
function every(fn, ms) { fn(); S.timers.push(setInterval(() => { if (!document.hidden) fn(); }, ms)); }
function startPolling() {
  const has = id => !!$('#w-' + id);
  if (has('clock')) S.timers.push(setInterval(renderClockTime, 1000));
  if (has('system') || has('clock')) every(loadSys, 3000);
  if (has('docker')) every(loadDocker, 8000);
  if (has('compose')) every(loadCompose, 10000);
  if (has('ha')) every(loadHA, 10000);
}
const quiet = fn => async () => { try { await fn(); } catch { /* keep last data */ } };
const loadSys = quiet(async () => {
  const s = S.sys = await api('/api/system'); S.srvOff = s.time.epoch * 1000 - Date.now();
  const push = (a, v) => { a.push(v); if (a.length > 60) a.shift(); };
  push(S.hist.cpu, s.cpu.usage); push(S.hist.rx, s.net.rx); push(S.hist.tx, s.net.tx);
  renderSystem(); renderClockTime();
});
const changed = (k, d) => { const j = JSON.stringify(d); if (S._j[k] === j) return false; S._j[k] = j; return true; };
const loadDocker = quiet(async () => { const d = await api('/api/docker/containers'); if (changed('docker', d)) { S.dock = d; renderDocker(); } });
const loadCompose = quiet(async () => { const d = await api('/api/compose/projects'); if (changed('comp', d)) { S.comp = d; renderCompose(); } });
const loadHA = quiet(async () => { const d = await api('/api/ha/states'); if (changed('ha', d)) { S.ha = d; renderHA(); } });

function applySearch() {
  $$('[data-s]').forEach(e => e.classList.toggle('hidden', !!S.q && !e.dataset.s.includes(S.q)));
  $$('.cat').forEach(c => c.classList.toggle('hidden', !!S.q && !S.edit && !$$('[data-s]', c).some(x => !x.classList.contains('hidden'))));
}

/* ---------- clock */
function fmtDT(d, tz, o) { try { return new Intl.DateTimeFormat(LANG, { ...o, ...(tz ? { timeZone: tz } : {}) }).format(d); } catch { return new Intl.DateTimeFormat(LANG, o).format(d); } }
function renderClock() {
  const el = $('#w-clock'); if (!el) return;
  const zones = (S.cfg.clock_zones || []).map((z, i) => `<div class="card clock-z"><div class="time" id="ckz${i}"></div><div class="z">${esc(z.split('/').pop().replace(/_/g, ' '))}</div></div>`).join('');
  el.innerHTML = secHead(t('w_clock')) + `<div class="clocks"><div class="card clock-main"><div class="time" id="ck-t"></div><div class="date" id="ck-d"></div></div>${zones}<div class="clock-srv" id="ck-s"></div></div>`;
  renderClockTime();
}
function renderClockTime() {
  if (!$('#ck-t')) return;
  const now = new Date(), tz = S.cfg.timezone, h12 = !S.cfg.time24;
  const tm = { hour: '2-digit', minute: '2-digit', hour12: h12 };
  $('#ck-t').textContent = fmtDT(now, tz, { ...tm, second: '2-digit' });
  $('#ck-d').textContent = fmtDT(now, tz, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  (S.cfg.clock_zones || []).forEach((z, i) => { const e = $('#ckz' + i); if (e) e.textContent = fmtDT(now, z, tm); });
  const s = $('#ck-s');
  if (s && S.sys) {
    const srv = new Date(Date.now() + S.srvOff);
    s.innerHTML = `<div>${esc(t('server_time'))}: <b>${esc(fmtDT(srv, S.sys.time.tz, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: h12 }))}</b> <span class="small">(${esc(S.sys.time.tz)})</span></div><div>${esc(t('uptime'))}: <b>${fmtUp(S.sys.uptime + (Date.now() - (srv - S.srvOff)) / 1000)}</b></div>`;
  }
}

/* ---------- system */
const ring = p => `<div class="ring ${lvl(p)}"><svg width="96" height="96" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="${(251.3 * (1 - Math.min(100, p) / 100)).toFixed(1)}"/></svg><div class="v">${Math.round(p)}%</div></div>`;
function spark(a, max) {
  if (a.length < 2) return '<svg class="spark"></svg>';
  const m = max || Math.max(1, ...a);
  const line = a.map((v, i) => `${(i / (a.length - 1) * 120).toFixed(1)},${(34 - v / m * 32).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 120 36" preserveAspectRatio="none"><path d="M0,36 L${line.split(' ').join(' L')} L120,36Z"/><polyline points="${line}"/></svg>`;
}
function renderSystem() {
  const el = $('#w-system'); if (!el) return;
  const s = S.sys, head = secHead(t('w_system'));
  if (!s) { el.innerHTML = head + `<div class="card empty">${esc(t('loading'))}</div>`; return; }
  const m = s.memory, mp = m.total ? m.used / m.total * 100 : 0, sp = m.swap_total ? m.swap_used / m.swap_total * 100 : 0;
  const temps = [...s.temps.map(x => ({ n: (x.group && !x.label.startsWith(x.group) ? x.group + ' ' : '') + x.label, v: x.value, crit: x.crit })),
    ...s.gpus.map(g => ({ n: g.name, v: g.temp, crit: null }))].slice(0, 20);
  const tcls = x => x.v >= (x.crit ? x.crit - 5 : 85) ? 'bad' : x.v >= 70 ? 'warn' : '';
  const cards = [
    `<div class="card"><h3>${t('host')}<span class="small">v${esc(s.version)}</span></h3><dl class="kv"><dt>${t('host')}</dt><dd>${esc(s.hostname)}</dd><dt>${t('os')}</dt><dd>${esc(s.os)}</dd><dt>${t('kernel')}</dt><dd>${esc(s.kernel)} (${esc(s.arch)})</dd><dt>${t('uptime')}</dt><dd>${fmtUp(s.uptime)}</dd><dt>${t('cpu')}</dt><dd>${esc(s.cpu.model)}</dd>${s.gpus.map(g => `<dt>${t('gpu')}</dt><dd>${esc(g.name)} · ${Math.round(g.util)}% · ${fmtB(g.mem_used)}/${fmtB(g.mem_total)}</dd>`).join('')}</dl></div>`,
    `<div class="card"><h3>${t('cpu')}<span class="small">${s.cpu.cores} ${t('cores')}</span></h3><div class="cpu-wrap">${ring(s.cpu.usage)}<div class="grow"><div class="small muted">${t('load')}</div><div><b>${s.cpu.load.map(x => x.toFixed(2)).join(' · ')}</b></div>${spark(S.hist.cpu, 100)}</div></div><div class="cores">${s.cpu.per_core.map(v => `<i style="height:${Math.max(4, v)}%" title="${v}%"></i>`).join('')}</div></div>`,
    `<div class="card"><h3>${t('memory')}<span class="small">${mp.toFixed(0)}%</span></h3><div class="metric"><div class="top"><span>${fmtB(m.used)} ${t('used')}</span><span class="muted">${fmtB(m.total)}</span></div>${bar(mp)}</div>${m.swap_total ? `<div class="metric"><div class="top"><span>${t('swap')} ${fmtB(m.swap_used)}</span><span class="muted">${fmtB(m.swap_total)}</span></div>${bar(sp)}</div>` : ''}</div>`,
    `<div class="card"><h3>${t('disks')}</h3>${s.disks.map(d => { const p = d.total ? d.used / d.total * 100 : 0; return `<div class="metric"><div class="top"><span title="${esc(d.path)}">${esc(d.label)}</span><span class="muted">${fmtB(d.used)} / ${fmtB(d.total)} · ${p.toFixed(0)}%</span></div>${bar(p)}</div>`; }).join('') || `<div class="muted">–</div>`}</div>`,
    `<div class="card"><h3>${t('network')}</h3><div class="net"><div><div class="l">↓</div><b>${fmtB(s.net.rx)}/s</b>${spark(S.hist.rx)}</div><div><div class="l">↑</div><b>${fmtB(s.net.tx)}/s</b>${spark(S.hist.tx)}</div></div></div>`,
    `<div class="card"><h3>${t('temps')}</h3>${temps.length ? `<div class="chips">${temps.map(x => `<span class="chip ${tcls(x)}">${esc(x.n)} <b>${x.v.toFixed(0)}°C</b></span>`).join('')}</div>` : `<div class="muted">${t('no_temps')}</div>`}</div>`,
  ];
  el.innerHTML = head + `<div class="sys">${cards.join('')}</div>`;
}

/* ---------- links */
function tile(l, ci, li) {
  const attrs = `class="tile card" data-s="${esc((l.name + ' ' + l.desc + ' ' + l.url).toLowerCase())}"`;
  const inner = `${icon(l.icon, l.url, l.name)}<div class="t"><div class="n">${esc(l.name)}</div>${l.desc ? `<div class="d">${esc(l.desc)}</div>` : ''}</div>`;
  if (S.edit) return `<div ${attrs} draggable="true" data-act="edit-link" data-ci="${ci}" data-li="${li}">${inner}<span class="pen">✎</span></div>`;
  return `<a ${attrs} href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
}
function renderLinks() {
  const el = $('#w-links'); if (!el) return;
  let html = secHead(t('w_links'), S.edit ? `<button class="btn sm" data-act="add-cat">+ ${esc(t('add_category'))}</button>` : '');
  S.cfg.categories.forEach((c, ci) => {
    html += `<div class="cat"><div class="cat-h">${esc(c.name) || '&nbsp;'}${S.edit ? ` <button class="btn sm icon" data-act="rename-cat" data-ci="${ci}" title="${esc(t('rename'))}">✎</button><button class="btn sm icon danger" data-act="del-cat" data-ci="${ci}" title="${esc(t('delete'))}">🗑</button>` : ''}</div><div class="tiles" data-ci="${ci}">`;
    c.links.forEach((l, li) => { html += tile(l, ci, li); });
    if (S.edit) html += `<div class="tile card add" data-act="add-link" data-ci="${ci}">+ ${esc(t('add_link'))}</div>`;
    html += '</div></div>';
  });
  el.innerHTML = html; applySearch();
}
async function saveCfg() { await api('/api/config', { method: 'PUT', body: S.cfg }); await loadCfg(); }

function modal(title, body, o = {}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<form class="modal ${o.wide ? 'wide' : ''}" autocomplete="off"><h2>${esc(title)}</h2>${body}<div class="foot">${o.extra || ''}<button type="button" class="btn" data-close>${esc(o.onSubmit ? t('cancel') : t('close'))}</button>${o.onSubmit ? `<button class="btn primary" type="submit">${esc(o.submit || t('save'))}</button>` : ''}</div></form>`;
  document.body.appendChild(ov);
  const onKey = e => { if (e.key === 'Escape') ov.close(); };
  ov.close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov.close(); });
  $('[data-close]', ov).onclick = ov.close;
  const form = $('form', ov);
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!o.onSubmit) return;
    const btn = $('button[type=submit]', form); btn.disabled = true;
    try { await o.onSubmit(Object.fromEntries(new FormData(form)), ov); ov.close(); } catch (err) { toast(errMsg(err), 'err'); btn.disabled = false; }
  });
  const first = $('input:not([type=hidden]), textarea', form); if (first && o.focus !== false) first.focus();
  return ov;
}

function linkDialog(ci, li) {
  const isNew = li == null;
  const l = isNew ? { name: '', url: 'https://', icon: '', desc: '' } : S.cfg.categories[ci].links[li];
  const cats = S.cfg.categories.map((c, i) => `<option value="${i}" ${i === ci ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const ov = modal(isNew ? t('add_link') : t('edit_link'), `
    <label class="f"><span>${t('name')}</span><input type="text" name="name" value="${esc(l.name)}" required></label>
    <label class="f"><span>${t('url')}</span><input type="url" name="url" value="${esc(l.url)}" required></label>
    <label class="f"><span>${t('icon')}</span><input type="text" name="icon" value="${esc(l.icon)}"><small class="muted">${esc(t('icon_hint'))}</small></label>
    <label class="f"><span>${t('description')}</span><input type="text" name="desc" value="${esc(l.desc)}"></label>
    <label class="f"><span>${t('category')}</span><select name="cat">${cats}</select></label>`, {
    extra: isNew ? '' : `<button type="button" class="btn danger" data-del>${esc(t('delete'))}</button>`,
    onSubmit: async f => {
      const nl = { name: f.name, url: f.url, icon: f.icon, desc: f.desc }, tc = +f.cat;
      if (!isNew) S.cfg.categories[ci].links.splice(li, 1);
      if (!isNew && tc === ci) S.cfg.categories[tc].links.splice(li, 0, nl); else S.cfg.categories[tc].links.push(nl);
      await saveCfg(); renderLinks();
    } });
  const d = $('[data-del]', ov);
  if (d) d.onclick = async () => { if (!confirm(t('confirm'))) return; S.cfg.categories[ci].links.splice(li, 1); await saveCfg(); renderLinks(); ov.close(); };
}

/* drag & drop re-ordering of links in edit mode */
let drag = null;
document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('.tile[draggable=true]'); if (!el) return; drag = { ci: +el.dataset.ci, li: +el.dataset.li }; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'link'); });
document.addEventListener('dragover', e => { if (drag && e.target.closest && e.target.closest('.tiles')) e.preventDefault(); });
document.addEventListener('dragend', () => { drag = null; });
document.addEventListener('drop', async e => {
  if (!drag) return; const grid = e.target.closest && e.target.closest('.tiles'); if (!grid) return; e.preventDefault();
  const tl = e.target.closest('.tile[draggable=true]'), tci = +grid.dataset.ci, links = S.cfg.categories[tci].links;
  let tli = tl ? +tl.dataset.li : links.length; const [item] = S.cfg.categories[drag.ci].links.splice(drag.li, 1);
  if (tci === drag.ci && drag.li < tli) tli--; links.splice(tli, 0, item); drag = null;
  renderLinks(); try { await saveCfg(); } catch (err) { toast(errMsg(err), 'err'); }
});

/* ---------- docker */
const guessIcon = c => c.icon || 'di:' + c.image.split('@')[0].split(':')[0].split('/').pop().toLowerCase();
function appUrl(c) {
  if (c.url) return c.url;
  if (!S.cfg.docker.autolinks || c.state !== 'running') return '';
  const tcp = c.ports.filter(p => p.type === 'tcp'); if (!tcp.length) return '';
  const pref = [80, 8080, 3000, 8000, 8096, 443, 8443, 9000, 5000];
  const p = tcp.find(p => pref.includes(p.private)) || tcp[0];
  return `${[443, 8443, 9443].includes(p.private) ? 'https' : 'http'}://${location.hostname}:${p.public}`;
}
function dcard(c) {
  const url = appUrl(c), admin = S.me.role === 'admin', run = c.state === 'running';
  const dot = run ? 'ok' : ['paused', 'restarting'].includes(c.state) ? 'warn' : c.state === 'dead' ? 'bad' : '';
  const ports = c.ports.map(p => `<a class="port" target="_blank" rel="noopener" href="${esc(location.protocol + '//' + location.hostname + ':' + p.public)}">${p.public}</a>`).join('');
  const b = (a, label, cls = '') => `<button class="btn sm ${cls}" data-act="d-act" data-id="${esc(c.id)}" data-a="${a}">${esc(t(label))}</button>`;
  return `<div class="card dc" data-s="${esc((c.name + ' ' + c.image + ' ' + c.project).toLowerCase())}">
    <div class="head">${icon(guessIcon(c), url, c.name)}<div class="grow"><div class="nm">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)}</div><div class="im" title="${esc(c.image)}">${esc(c.image)}</div></div></div>
    <div class="st"><span class="dot ${dot}"></span>${esc(c.status)}${c.project ? ` · <span title="compose project">${esc(c.project)}</span>` : ''}</div>
    ${ports ? `<div class="chips" style="gap:6px">${ports}</div>` : ''}
    <div class="acts">${url ? `<a class="btn sm primary" href="${esc(url)}" target="_blank" rel="noopener">${esc(t('open'))} ↗</a>` : ''}${admin ? (run ? b('restart', 'restart') + b('stop', 'stop', 'danger') : b('start', 'start')) : ''}${admin ? `<button class="btn sm" data-act="d-logs" data-id="${esc(c.id)}" data-n="${esc(c.name)}">${esc(t('logs'))}</button>` : ''}</div></div>`;
}
function renderDocker() {
  const el = $('#w-docker'); if (!el) return;
  const d = S.dock, head = secHead(t('w_docker'));
  if (!d) { el.innerHTML = head + `<div class="card empty">${esc(t('loading'))}</div>`; return; }
  if (!d.available) { el.innerHTML = head + `<div class="card empty">${esc(t('no_docker'))}<div class="small mono" style="margin-top:6px">${esc(d.error)}</div></div>`; return; }
  const list = d.containers, nRun = list.filter(c => c.state === 'running').length;
  const shown = list.filter(c => S.filter === 'all' || (S.filter === 'running') === (c.state === 'running'));
  const cnt = { all: list.length, running: nRun, stopped: list.length - nRun };
  el.innerHTML = head + `<div class="toolbar"><div class="seg">${['all', 'running', 'stopped'].map(f => `<button data-act="dfilter" data-f="${f}" class="${S.filter === f ? 'on' : ''}">${esc(t(f))} ${cnt[f]}</button>`).join('')}</div></div>
    <div class="dock">${shown.map(dcard).join('') || `<div class="card empty">${esc(t('no_containers'))}</div>`}</div>`;
  applySearch();
}

/* ---------- compose */
function renderCompose() {
  const el = $('#w-compose'); if (!el) return;
  const admin = S.me.role === 'admin', c = S.comp;
  const head = secHead(t('w_compose'), admin ? `<button class="btn sm" data-act="cfiles">📄 ${esc(t('files'))}</button>` : '');
  if (!c) { el.innerHTML = head + `<div class="card empty">${esc(t('loading'))}</div>`; return; }
  if (!c.available) { el.innerHTML = head + `<div class="card empty">${esc(t('no_docker'))}</div>`; return; }
  const btn = (p, a, label, cls = '') => `<button class="btn sm ${cls}" data-act="c-act" data-p="${esc(p.name)}" data-a="${a}">${esc(t(label))}</button>`;
  const cards = c.projects.map(p => {
    const pc = p.total ? p.running / p.total * 100 : 0;
    const acts = !admin ? '' : [
      p.total ? btn(p, 'restart', 'restart') + (p.running ? btn(p, 'stop', 'stop') : btn(p, 'start', 'start')) : '',
      p.can_cli ? btn(p, 'up', 'up') + btn(p, 'pull', 'pull') + (p.total ? btn(p, 'down', 'down', 'danger') : '') : '',
      p.file ? `<button class="btn sm" data-act="cedit" data-p="${esc(p.file)}">✎ ${esc(t('edit_file'))}</button>` : '',
    ].join('');
    return `<div class="card proj" data-s="${esc(p.name.toLowerCase())}"><div class="head"><div class="nm">${esc(p.name)}</div><span class="small muted">${p.running}/${p.total} · ${p.total} ${esc(t('services'))}</span></div>${bar(pc)}
      <div class="svc">${p.services.map(s => `<span><i class="dot ${s.state === 'running' ? 'ok' : ''}"></i>${esc(s.service || s.container)}</span>`).join('')}</div><div class="acts" style="display:flex;gap:6px;flex-wrap:wrap">${acts}</div></div>`;
  }).join('');
  el.innerHTML = head + `<div class="dock">${cards || `<div class="card empty">${esc(t('no_compose'))}</div>`}</div>`; applySearch();
}
async function composeEditor(path) {
  const r = path ? await api('/api/compose/file?path=' + encodeURIComponent(path)) : { content: 'services:\n  app:\n    image: nginx:alpine\n    ports:\n      - "8081:80"\n' };
  modal(t('edit_file'), `<label class="f"><span>${t('file_path')}</span><input type="text" name="path" value="${esc(path || 'my-stack/compose.yaml')}" ${path ? 'readonly' : ''} required></label><label class="f"><span>YAML</span><textarea name="content" rows="20" spellcheck="false" style="width:100%">${esc(r.content)}</textarea></label>`, {
    wide: true, onSubmit: async f => { await api('/api/compose/file', { method: 'PUT', body: f }); toast(t('saved'), 'ok'); loadCompose(); } });
}

/* ---------- home assistant */
const HA_ICON = { light: '💡', switch: '🔌', input_boolean: '🔘', fan: '🌀', scene: '🎬', script: '📜', automation: '⚙️', button: '🔲', input_button: '🔲', cover: '🪟', media_player: '🎵', sensor: '📟', binary_sensor: '🔔', climate: '🌡️', lock: '🔒', person: '🧑', weather: '⛅', sun: '☀️', device_tracker: '📍', input_number: '🔢' };
const HA_ACT = { light: 'toggle', switch: 'toggle', input_boolean: 'toggle', fan: 'toggle', automation: 'toggle', cover: 'toggle', scene: 'turn_on', script: 'turn_on', button: 'press', input_button: 'press', media_player: 'media_play_pause' };
function renderHA() {
  const el = $('#w-ha'); if (!el) return;
  const h = S.ha, head = secHead(t('w_ha')), admin = S.me.role === 'admin';
  if (!h) { el.innerHTML = head + `<div class="card empty">${esc(t('loading'))}</div>`; return; }
  if (!h.configured) { el.innerHTML = head + `<div class="card empty">${esc(t('ha_not_configured'))}${admin ? ` <a href="#/admin/integrations" style="color:var(--accent)">${esc(t('ha_setup'))}</a>` : ''}</div>`; return; }
  if (h.error) { el.innerHTML = head + `<div class="card empty">⚠ ${esc(h.error)}</div>`; return; }
  if (!h.entities.length) { el.innerHTML = head + `<div class="card empty">${esc(t('ha_empty'))}</div>`; return; }
  el.innerHTML = head + `<div class="ha">${h.entities.map(e => {
    const dom = e.id.split('.')[0], act = HA_ACT[dom], on = ['on', 'open', 'playing', 'home', 'unlocked', 'heat', 'cool'].includes(e.state);
    const st = e.state === 'unavailable' ? t('unavailable') : e.state + (e.unit ? ' ' + e.unit : '');
    return `<div class="card hat ${act ? 'act' : ''} ${on ? 'on' : ''}" ${act ? `data-act="ha" data-id="${esc(e.id)}"` : ''} data-s="${esc((e.name + ' ' + e.id).toLowerCase())}"><div class="e">${HA_ICON[dom] || '◻️'}</div><div class="s">${esc(st)}</div><div class="n" title="${esc(e.id)}">${esc(e.name)}</div></div>`;
  }).join('')}</div>`;
  applySearch();
}

/* ---------- profile */
function profileDialog() {
  const themeOpts = ['', 'auto', 'dark', 'light', 'midnight', 'nord', 'dracula', 'forest'].map(x => `<option value="${x}" ${S.me.theme === x ? 'selected' : ''}>${x ? (x === 'auto' ? t('auto') : x[0].toUpperCase() + x.slice(1)) : t('language_auto')}</option>`).join('');
  modal(t('profile') + ' – ' + S.me.username, `
    <div class="grid2"><label class="f"><span>${t('language')}</span><select name="language"><option value="">${t('language_auto')}</option>${langOptions(S.me.language)}</select></label>
    <label class="f"><span>${t('theme')}</span><select name="theme">${themeOpts}</select></label></div>
    <hr style="border:0;border-top:1px solid var(--card-b);margin:6px 0 14px">
    <label class="f"><span>${t('current_password')}</span><input type="password" name="current_password" autocomplete="current-password"></label>
    <label class="f"><span>${t('new_password')} · ${esc(t('password_hint'))}</span><input type="password" name="password" autocomplete="new-password"></label>`, {
    onSubmit: async f => {
      const body = { language: f.language, theme: f.theme }; if (f.password) { body.password = f.password; body.current_password = f.current_password; }
      await api('/api/me', { method: 'PUT', body });
      S.me = await api('/api/me'); LANG = S.me.language || S.cfg.language; localStorage.setItem('hd_lang', LANG); applyLook(S.cfg); route();
    } });
}

/* ---------- actions (event delegation) */
const ACTIONS = {
  'edit-toggle'() { S.edit = !S.edit; route(); },
  async 'add-cat'() { const n = prompt(t('category_name')); if (!n) return; S.cfg.categories.push({ name: n, links: [] }); await saveCfg(); renderLinks(); },
  async 'rename-cat'(el) { const c = S.cfg.categories[+el.dataset.ci], n = prompt(t('category_name'), c.name); if (n == null) return; c.name = n; await saveCfg(); renderLinks(); },
  async 'del-cat'(el) { if (!confirm(t('confirm'))) return; S.cfg.categories.splice(+el.dataset.ci, 1); await saveCfg(); renderLinks(); },
  'add-link'(el) { linkDialog(+el.dataset.ci, null); },
  'edit-link'(el) { linkDialog(+el.dataset.ci, +el.dataset.li); },
  dfilter(el) { S.filter = el.dataset.f; renderDocker(); },
  async 'd-act'(el) { el.disabled = true; try { await api('/api/docker/action', { method: 'POST', body: { id: el.dataset.id, action: el.dataset.a } }); } finally { await loadDocker(); await loadCompose(); } },
  async 'd-logs'(el) {
    const ov = modal(el.dataset.n + ' – ' + t('logs'), `<pre class="logs" id="lg">${esc(t('loading'))}</pre>`, { wide: true, focus: false });
    try { const r = await api('/api/docker/logs?tail=300&id=' + encodeURIComponent(el.dataset.id)); const p = $('#lg', ov); p.textContent = r.logs || '–'; p.scrollTop = p.scrollHeight; } catch (e) { $('#lg', ov).textContent = errMsg(e); }
  },
  async 'c-act'(el) {
    const a = el.dataset.a; if ((a === 'down' || a === 'stop') && !confirm(t('confirm'))) return;
    el.disabled = true; toast('…');
    try {
      const r = await api('/api/compose/action', { method: 'POST', body: { project: el.dataset.p, action: a } });
      if (r.output) modal(el.dataset.p + ' – ' + a, `<pre class="logs">${esc(r.output)}</pre>`, { wide: true, focus: false }); else toast('✓ ' + a, 'ok');
    } finally { await loadCompose(); await loadDocker(); }
  },
  async cfiles() {
    const r = await api('/api/compose/files');
    const ov = modal(t('files'), `<div class="muted small" style="margin-bottom:10px">${esc(t('compose_dir'))}: <span class="mono">${esc(r.dir)}</span></div>${r.files.map(f => `<div class="row sb" style="padding:6px 0;border-bottom:1px solid var(--card-b)"><span class="mono small">${esc(f)}</span><button type="button" class="btn sm" data-act="cedit" data-p="${esc(f)}">✎</button></div>`).join('') || `<div class="muted">${esc(t('no_compose'))}</div>`}<div style="margin-top:12px"><button type="button" class="btn sm" data-act="cnew">+ ${esc(t('new_file'))}</button></div>`, { focus: false });
    ov.addEventListener('click', e => { if (e.target.closest('[data-act=cedit],[data-act=cnew]')) ov.close(); });
  },
  cedit(el) { return composeEditor(el.dataset.p); },
  cnew() { return composeEditor(null); },
  async ha(el) {
    const id = el.dataset.id, dom = id.split('.')[0];
    await api('/api/ha/service', { method: 'POST', body: { domain: dom, service: HA_ACT[dom], entity_id: id } });
    setTimeout(loadHA, 600);
  },
  profile: profileDialog,
  async logout() { await api('/api/logout', { method: 'POST', body: {} }); S.me = null; stopTimers(); location.hash = ''; boot(); },
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  try { await fn(el, e); } catch (err) { toast(errMsg(err), 'err'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && S.route === 'home') { loadSys(); loadDocker(); } });
document.addEventListener('DOMContentLoaded', () => boot().catch(err => { $('#app').innerHTML = `<div class="auth"><div class="card">⚠ ${esc(err.message)}</div></div>`; }));

</script>
<script>
'use strict';
/* HomeDash admin panel: general, appearance, integrations (Home Assistant, terminal, docker), users, API tokens, backup */
const ADMIN_TABS = ['general', 'appearance', 'integrations', 'users', 'tokens', 'backup'];

function viewAdmin(tab) {
  if (!ADMIN_TABS.includes(tab)) tab = 'general';
  $('#view').innerHTML = `<div class="admin"><div class="side">${ADMIN_TABS.map(x => `<a href="#/admin/${x}" class="${x === tab ? 'on' : ''}">${esc(t(x))}</a>`).join('')}</div><div class="card panel" id="panel"></div></div>`;
  ({ general: pGeneral, appearance: pAppearance, integrations: pIntegrations, users: pUsers, tokens: pTokens, backup: pBackup })[tab]($('#panel'));
}

/* ----- generic form helpers: inputs use name="a.b.c" to address S.cfg */
const field = (label, name, val, type = 'text', extra = '') => `<label class="f"><span>${esc(label)}</span><input type="${type}" name="${name}" value="${esc(val)}" ${extra}></label>`;
const check = (label, name, on) => `<label class="chk"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}> ${esc(label)}</label>`;
function selectF(label, name, val, opts) { return `<label class="f"><span>${esc(label)}</span><select name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`; }
function setPath(o, path, v) { const p = path.split('.'); let c = o; while (p.length > 1) c = c[p.shift()]; c[p[0]] = v; }
function collect(form, extra) {
  const cfg = JSON.parse(JSON.stringify(S.cfg));
  $$('[name]', form).forEach(el => {
    let v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
    if (el.dataset.t === 'list') v = v.split(',').map(x => x.trim()).filter(Boolean);
    if (el.dataset.t === 'entities') v = v.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [id, ...n] = l.split('|'); return { id: id.trim(), name: n.join('|').trim() }; });
    setPath(cfg, el.name, v);
  });
  return extra ? extra(cfg) : cfg;
}
async function saveForm(form, extra) {
  await api('/api/config', { method: 'PUT', body: collect(form, extra) });
  await loadCfg(); LANG = S.me.language || localStorage.getItem('hd_lang') || S.cfg.language; applyLook(S.cfg); toast(t('saved'), 'ok');
}
const saveBtn = () => `<div class="row" style="margin-top:8px"><button class="btn primary" type="submit">${esc(t('save_all'))}</button></div>`;
function wireForm(form, extra, live) {
  form.onsubmit = async e => { e.preventDefault(); try { await saveForm(form, extra); route(); } catch (err) { toast(errMsg(err), 'err'); } };
  if (live) form.addEventListener('input', () => applyLook(collect(form, extra)));
}

/* ----- General */
function pGeneral(p) {
  const c = S.cfg;
  p.innerHTML = `<h2>${esc(t('general'))}</h2><form id="f">
    <div class="grid2">${field(t('title'), 'title', c.title, 'text', 'maxlength="60"')}${field(t('subtitle'), 'subtitle', c.subtitle, 'text', 'maxlength="120"')}</div>
    <div class="grid2">${selectF(t('language'), 'language', c.language, Object.entries(LANG_NAMES))}
    <label class="f"><span>${esc(t('timezone'))}</span><input type="text" name="timezone" list="tzs" value="${esc(c.timezone)}" placeholder="Europe/Berlin"><datalist id="tzs">${(Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : []).map(z => `<option value="${z}">`).join('')}</datalist></label></div>
    ${check(t('time24'), 'time24', c.time24)}
    <label class="f"><span>${esc(t('clock_zones'))}</span><input type="text" name="clock_zones" data-t="list" value="${esc((c.clock_zones || []).join(', '))}" placeholder="America/New_York, Asia/Tokyo"></label>
    ${saveBtn()}</form>`;
  wireForm($('#f', p));
}

/* ----- Appearance (live preview while editing) */
function pAppearance(p) {
  const c = S.cfg; let ws = JSON.parse(JSON.stringify(c.widgets));
  const themes = ['auto', 'dark', 'light', 'midnight', 'nord', 'dracula', 'forest'].map(x => [x, x === 'auto' ? t('auto') : x[0].toUpperCase() + x.slice(1)]);
  p.innerHTML = `<h2>${esc(t('appearance'))}</h2><form id="f">
    <div class="grid2">${selectF(t('theme'), 'theme', c.theme, themes)}
    <label class="f"><span>${esc(t('accent'))}</span><input type="color" name="accent" value="${esc(c.accent)}"></label></div>
    <div class="grid2"><label class="f"><span>${esc(t('radius'))}: <b id="rv">${c.radius}</b>px</span><input type="range" name="radius" min="0" max="32" value="${c.radius}"></label>
    <label class="f"><span>${esc(t('columns'))}: <b id="cv">${c.columns}</b></span><input type="range" name="columns" min="1" max="8" value="${c.columns}"></label></div>
    ${selectF(t('card_style'), 'card_style', c.card_style, [['glass', t('glass')], ['solid', t('solid')], ['flat', t('flat')]])}
    ${field(t('background'), 'background', c.background, 'text', 'placeholder="https://…/wallpaper.jpg"')}
    <label class="f"><span>${esc(t('widgets_order'))}</span><div class="wl" id="wl"></div></label>
    <label class="f"><span>${esc(t('custom_css'))}</span><textarea name="custom_css" rows="5" spellcheck="false" placeholder=":root { --accent: #ff6b6b; }">${esc(c.custom_css)}</textarea></label>
    ${saveBtn()}</form>`;
  const form = $('#f', p), drawWL = () => {
    $('#wl', p).innerHTML = ws.map((w, i) => `<div class="it"><input type="checkbox" data-i="${i}" ${w.on ? 'checked' : ''} style="accent-color:var(--accent)"><span class="grow">${esc(t('w_' + w.id))}</span><button type="button" class="btn sm icon" data-m="${i}:-1" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="btn sm icon" data-m="${i}:1" ${i === ws.length - 1 ? 'disabled' : ''}>↓</button></div>`).join('');
  };
  drawWL();
  $('#wl', p).onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; const [i, d] = b.dataset.m.split(':').map(Number); [ws[i], ws[i + d]] = [ws[i + d], ws[i]]; drawWL(); };
  $('#wl', p).onchange = e => { ws[+e.target.dataset.i].on = e.target.checked; };
  form.addEventListener('input', () => { $('#rv', p).textContent = form.radius.value; $('#cv', p).textContent = form.columns.value; });
  wireForm(form, cfg => { cfg.widgets = ws; return cfg; }, true);
}

/* ----- Integrations */
function pIntegrations(p) {
  const c = S.cfg, ha = c.ha;
  p.innerHTML = `<h2>${esc(t('integrations'))}</h2><form id="f">
    <h3 style="margin-bottom:12px">🏠 Home Assistant</h3>
    <div class="grid2">${field(t('ha_url'), 'ha.url', ha.url, 'text', 'placeholder="http://homeassistant.local:8123"')}${field(t('ha_token'), 'ha.token', ha.token, 'password', 'autocomplete="off"')}</div>
    ${check(t('verify_tls'), 'ha.verify_tls', ha.verify_tls)}
    <label class="f"><span>${esc(t('entities'))} · ${esc(t('entities_hint'))}</span><textarea name="ha.entities" data-t="entities" rows="6" spellcheck="false" placeholder="light.living_room|Living room&#10;sensor.outdoor_temperature">${esc(ha.entities.map(e => e.id + (e.name ? '|' + e.name : '')).join('\n'))}</textarea></label>
    <div class="row" style="margin-bottom:22px"><button type="button" class="btn" id="ha-test">${esc(t('test'))}</button><button type="button" class="btn" id="ha-pick">${esc(t('load_entities'))}</button></div>
    <h3 style="margin-bottom:12px">⌨ ${esc(t('terminal'))} / 🐳 Docker</h3>
    ${check(t('terminal_enabled'), 'terminal.enabled', c.terminal.enabled)}
    ${check(t('docker_autolinks'), 'docker.autolinks', c.docker.autolinks)}
    ${saveBtn()}</form>`;
  const form = $('#f', p); wireForm(form);
  $('#ha-test', p).onclick = async () => {
    try { const r = await api('/api/ha/test', { method: 'POST', body: { url: form['ha.url'].value, token: form['ha.token'].value, verify_tls: form['ha.verify_tls'].checked } }); toast(t('test_ok') + ': ' + r.message, 'ok'); }
    catch (e) { toast(errMsg(e), 'err'); }
  };
  $('#ha-pick', p).onclick = async () => {
    let list; try { list = (await api('/api/ha/entities')).entities; } catch (e) { return toast(errMsg(e) + ' (' + t('save_all') + '?)', 'err'); }
    const ov = modal(t('load_entities'), `<input type="text" id="hq" placeholder="${esc(t('search'))}" style="margin-bottom:10px"><div id="hl" style="max-height:50vh;overflow:auto"></div>`, {});
    const draw = () => { const q = $('#hq', ov).value.toLowerCase(); $('#hl', ov).innerHTML = list.filter(x => (x.id + x.name).toLowerCase().includes(q)).slice(0, 150).map(x => `<div class="row sb" style="padding:6px 0;border-bottom:1px solid var(--card-b)"><span><span class="mono small">${esc(x.id)}</span><br><span class="muted small">${esc(x.name)}</span></span><button type="button" class="btn sm" data-id="${esc(x.id)}" data-n="${esc(x.name)}">+</button></div>`).join(''); };
    draw(); $('#hq', ov).oninput = draw;
    $('#hl', ov).onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; const ta = form['ha.entities']; ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + b.dataset.id + '|' + b.dataset.n; b.disabled = true; b.textContent = '✓'; };
  };
}

/* ----- Users */
async function pUsers(p) {
  const { users } = await api('/api/users');
  p.innerHTML = `<h2>${esc(t('users'))}</h2><table class="t"><tr><th>${esc(t('username'))}</th><th>${esc(t('role'))}</th><th>${esc(t('created'))}</th><th></th></tr>
    ${users.map(u => `<tr><td>${esc(u.username)}${u.username === S.me.username ? ' <span class="muted small">(you)</span>' : ''}</td>
      <td><select data-role="${esc(u.username)}" style="width:auto"><option value="user" ${u.role === 'user' ? 'selected' : ''}>${esc(t('role_user'))}</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>${esc(t('role_admin'))}</option></select></td>
      <td class="muted small">${new Date(u.created * 1000).toLocaleDateString(LANG)}</td>
      <td style="text-align:right"><button class="btn sm" data-pw="${esc(u.username)}">${esc(t('reset_password'))}</button> <button class="btn sm danger" data-rm="${esc(u.username)}">${esc(t('delete'))}</button></td></tr>`).join('')}</table>
    <h3 style="margin:24px 0 12px">${esc(t('add_user'))}</h3>
    <form id="nu"><div class="grid2">${field(t('username'), 'username', '', 'text', 'required autocomplete="off"')}${field(t('password') + ' · ' + t('password_hint'), 'password', '', 'password', 'required minlength="8" autocomplete="new-password"')}
    ${selectF(t('role'), 'role', 'user', [['user', t('role_user')], ['admin', t('role_admin')]])}</div><button class="btn primary" type="submit">${esc(t('add_user'))}</button></form>`;
  const again = () => pUsers(p);
  p.onchange = async e => { const u = e.target.dataset.role; if (!u) return; try { await api('/api/users', { method: 'PUT', body: { username: u, role: e.target.value } }); toast(t('saved'), 'ok'); } catch (err) { toast(errMsg(err), 'err'); again(); } };
  p.onclick = async e => {
    const pw = e.target.closest('[data-pw]'), rm = e.target.closest('[data-rm]');
    try {
      if (pw) { const v = prompt(t('new_password') + ' (' + t('password_hint') + ')'); if (v) { await api('/api/users', { method: 'PUT', body: { username: pw.dataset.pw, password: v } }); toast(t('saved'), 'ok'); } }
      if (rm && confirm(t('confirm'))) { await api('/api/users?username=' + encodeURIComponent(rm.dataset.rm), { method: 'DELETE' }); again(); }
    } catch (err) { toast(errMsg(err), 'err'); }
  };
  $('#nu', p).onsubmit = async e => { e.preventDefault(); try { await api('/api/users', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); again(); } catch (err) { toast(errMsg(err), 'err'); } };
}

/* ----- API tokens + Home Assistant sensor sample */
async function pTokens(p, fresh) {
  const { tokens } = await api('/api/tokens');
  const tok = fresh || 'YOUR_TOKEN';
  const yaml = `rest:\n  - resource: ${location.origin}/api/system\n    scan_interval: 30\n    headers:\n      Authorization: Bearer ${tok}\n    sensor:\n      - name: "Server CPU"\n        value_template: "{{ value_json.cpu.usage }}"\n        unit_of_measurement: "%"\n      - name: "Server RAM"\n        value_template: "{{ (value_json.memory.used / value_json.memory.total * 100) | round(1) }}"\n        unit_of_measurement: "%"\n      - name: "Server temperature"\n        value_template: "{{ value_json.temps[0].value if value_json.temps else none }}"\n        unit_of_measurement: "°C"\n        device_class: temperature`;
  p.innerHTML = `<h2>${esc(t('tokens'))}</h2>
    ${fresh ? `<div class="card" style="border-color:var(--ok);margin-bottom:16px"><div class="small muted">${esc(t('token_once'))}</div><input type="text" readonly value="${esc(fresh)}" class="mono" onfocus="this.select()" style="margin-top:8px"></div>` : ''}
    <table class="t"><tr><th>${esc(t('token_name'))}</th><th>${esc(t('created'))}</th><th></th></tr>${tokens.map(x => `<tr><td class="mono">${esc(x.name)}</td><td class="muted small">${new Date(x.created * 1000).toLocaleString(LANG)}</td><td style="text-align:right"><button class="btn sm danger" data-rm="${esc(x.name)}">${esc(t('delete'))}</button></td></tr>`).join('') || `<tr><td colspan="3" class="muted">${esc(t('none'))}</td></tr>`}</table>
    <form id="nt" class="row" style="margin:16px 0"><input type="text" name="name" placeholder="${esc(t('token_name'))}" required pattern="[A-Za-z0-9_.\\-]+" style="max-width:240px"><button class="btn primary">${esc(t('create_token'))}</button></form>
    <div class="muted small" style="margin-top:20px">${esc(t('ha_sample'))}</div><pre class="code">${esc(yaml)}</pre>`;
  $('#nt', p).onsubmit = async e => { e.preventDefault(); try { const r = await api('/api/tokens', { method: 'POST', body: { name: e.target.name.value } }); pTokens(p, r.token); } catch (err) { toast(errMsg(err), 'err'); } };
  p.onclick = async e => { const b = e.target.closest('[data-rm]'); if (b && confirm(t('confirm'))) { await api('/api/tokens?name=' + encodeURIComponent(b.dataset.rm), { method: 'DELETE' }); pTokens(p); } };
}

/* ----- Backup */
function pBackup(p) {
  p.innerHTML = `<h2>${esc(t('backup'))}</h2><div class="row"><button class="btn" id="ex">⬇ ${esc(t('export'))}</button><label class="btn" style="cursor:pointer">⬆ ${esc(t('import'))}<input type="file" id="im" accept="application/json" hidden></label></div>
    <p class="muted small" style="margin-top:16px">config.json · users.json · tokens.json → <span class="mono">/data</span></p>`;
  $('#ex', p).onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.cfg, null, 2)], { type: 'application/json' })); a.download = 'homedash-settings.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#im', p).onchange = async e => {
    try { const cfg = JSON.parse(await e.target.files[0].text()); await api('/api/config', { method: 'PUT', body: cfg }); await loadCfg(); applyLook(S.cfg); toast(t('imported'), 'ok'); route(); }
    catch (err) { toast(errMsg(err), 'err'); }
  };
}

<script>
'use strict';
/* HomeDash web terminal. Uses xterm.js when available (static/vendor/ or CDN) and falls back to a small built-in emulator. */
let TS = null; // active terminal session

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
function loadCss(href) { return new Promise((res, rej) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = res; l.onerror = () => rej(new Error('css')); document.head.appendChild(l); }); }
async function loadXterm() {
  if (window.Terminal && window.FitAddon) return true;
  const cdn = 'https://cdn.jsdelivr.net/npm/';
  const sets = [['/vendor/xterm.js', '/vendor/xterm.css', '/vendor/addon-fit.js'],
    [cdn + '@xterm/xterm@5.5.0/lib/xterm.js', cdn + '@xterm/xterm@5.5.0/css/xterm.css', cdn + '@xterm/addon-fit@0.10.0/lib/addon-fit.js']];
  for (const [js, css, fit] of sets) {
    try { await Promise.all([loadScript(js), loadCss(css)]); await loadScript(fit); if (window.Terminal && window.FitAddon) return true; } catch { /* try next */ }
  }
  return false;
}
const b64bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesB64 = s => { let b = ''; new TextEncoder().encode(s).forEach(x => { b += String.fromCharCode(x); }); return btoa(b); };

function closeTerm() {
  if (!TS) return;
  try { TS.es.close(); } catch { /* ignore */ }
  try { TS.ro.disconnect(); } catch { /* ignore */ }
  try { TS.term.dispose && TS.term.dispose(); } catch { /* ignore */ }
  TS = null;
}

async function viewTerminal() {
  $('#view').innerHTML = `<div class="row sb" style="margin-bottom:10px"><div class="muted small">${esc(t('term_note'))}</div><button class="btn sm" data-act="term-new">↻ ${esc(t('term_restart'))}</button></div><div class="termwrap" id="termwrap"></div>`;
  if (!sessionStorage.getItem('hd_term')) sessionStorage.setItem('hd_term', rand());
  await startTerm(sessionStorage.getItem('hd_term'), false);
}
ACTIONS['term-new'] = async () => {
  const old = sessionStorage.getItem('hd_term');
  closeTerm(); try { await api('/api/term/close', { method: 'POST', body: { id: old } }); } catch { /* gone */ }
  sessionStorage.setItem('hd_term', rand()); await startTerm(sessionStorage.getItem('hd_term'), true);
};

async function startTerm(sid, fresh) {
  closeTerm();
  const wrap = $('#termwrap'); if (!wrap) return; wrap.innerHTML = '';
  let term, fit;
  if (await loadXterm()) {
    term = new Terminal({ cursorBlink: true, fontSize: 14, scrollback: 5000, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', theme: { background: '#0b0d12' } });
    const fa = new FitAddon.FitAddon(); term.loadAddon(fa); term.open(wrap); fit = () => fa.fit();
  } else { term = new BasicTerm(wrap); fit = () => term.fit(); }
  fit(); term.focus && term.focus();
  const session = { term, es: null, ro: null }; TS = session;
  try { await api('/api/term/open', { method: 'POST', body: { id: sid, fresh, cols: term.cols, rows: term.rows } }); }
  catch (e) { wrap.innerHTML = `<div class="empty">${esc(e.message === 'terminal_disabled' ? t('term_disabled') : errMsg(e))}</div>`; return; }
  if (TS !== session) return;
  const es = session.es = new EventSource('/api/term/stream?id=' + encodeURIComponent(sid));
  es.onmessage = e => term.write(b64bytes(e.data));
  es.addEventListener('exit', () => { es.close(); term.write('\r\n\x1b[33m[' + t('term_exited') + ']\x1b[0m\r\n'); });
  let chain = Promise.resolve();
  const post = (path, body) => { chain = chain.then(() => api(path, { method: 'POST', body: { id: sid, ...body } })).catch(() => { }); };
  let buf = '', timer = null;
  term.onData(d => { buf += d; if (!timer) timer = setTimeout(() => { const data = buf; buf = ''; timer = null; post('/api/term/input', { data: bytesB64(data) }); }, 6); });
  let rt = null, last = '';
  const resize = () => { clearTimeout(rt); rt = setTimeout(() => { fit(); const k = term.cols + 'x' + term.rows; if (k !== last) { last = k; post('/api/term/resize', { cols: term.cols, rows: term.rows }); } }, 120); };
  session.ro = new ResizeObserver(resize); session.ro.observe(wrap);
}

/* ---------- minimal built-in terminal emulator (fallback when xterm.js cannot be loaded) ---------- */
class BasicTerm {
  constructor(host) {
    this.host = host; this.el = document.createElement('div'); this.el.className = 'bterm'; this.el.tabIndex = 0; host.appendChild(this.el);
    const probe = document.createElement('span'); probe.textContent = 'M'.repeat(20); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre'; this.el.appendChild(probe);
    const r = probe.getBoundingClientRect(); this.cw = (r.width / 20) || 8; this.ch = r.height || 18; probe.remove();
    this.dec = new TextDecoder('utf-8'); this.sb = []; this.st = 0; this.p = ''; this.cols = 80; this.rows = 24;
    this.cx = 0; this.cy = 0; this.fg = null; this.bg = null; this.bold = false; this.inv = false; this.ak = '';
    this.grid = Array.from({ length: this.rows }, () => this.blank());
    this.el.addEventListener('keydown', e => this.key(e)); this.el.addEventListener('paste', e => { e.preventDefault(); this.cb && this.cb(e.clipboardData.getData('text')); });
    this.el.addEventListener('mousedown', () => setTimeout(() => this.el.focus(), 0));
  }
  focus() { this.el.focus(); }
  dispose() { this.el.remove(); }
  onData(cb) { this.cb = cb; }
  blank() { return Array.from({ length: this.cols }, () => ({ c: ' ', a: '' })); }
  fit() {
    const r = this.host.getBoundingClientRect();
    this.resize(Math.max(20, Math.floor((r.width - 20) / this.cw)), Math.max(5, Math.floor((r.height - 16) / this.ch)));
  }
  resize(cols, rows) {
    while (this.grid.length < rows) this.grid.push(this.blank());
    while (this.grid.length > rows) { this.sb.push(this.grid.shift()); this.cy = Math.max(0, this.cy - 1); }
    for (const row of this.grid) { while (row.length < cols) row.push({ c: ' ', a: '' }); row.length = cols; }
    this.cols = cols; this.rows = rows; this.cx = Math.min(this.cx, cols - 1); this.cy = Math.min(this.cy, rows - 1); this.sched();
  }
  write(data) {
    const s = typeof data === 'string' ? data : this.dec.decode(data, { stream: true });
    for (const ch of s) {
      switch (this.st) {
        case 0:
          if (ch === '\x1b') this.st = 1;
          else if (ch === '\n') this.lf();
          else if (ch === '\r') this.cx = 0;
          else if (ch === '\b') this.cx = Math.max(0, this.cx - 1);
          else if (ch === '\t') this.cx = Math.min(this.cols - 1, (this.cx + 8) & ~7);
          else if (ch >= ' ' && ch !== '\x7f') this.put(ch);
          break;
        case 1: this.st = ch === '[' ? (this.p = '', 2) : ch === ']' ? 3 : (ch === '(' || ch === ')') ? 4 : 0; break;
        case 2: if (ch >= '@' && ch <= '~') { this.csi(ch, this.p); this.st = 0; } else this.p += ch; break;
        case 3: this.st = ch === '\x07' ? 0 : ch === '\x1b' ? 5 : 3; break;
        default: this.st = 0;
      }
    }
    this.sched();
  }
  put(ch) {
    if (this.cx >= this.cols) { this.cx = 0; this.lf(); }
    this.grid[this.cy][this.cx] = { c: ch, a: this.ak }; this.cx++;
  }
  lf() {
    if (this.cy < this.rows - 1) this.cy++;
